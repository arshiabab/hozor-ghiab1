# Local Postgres for development: docker compose up -d
services:
  db:
    image: postgres:17-alpine
    container_name: hozorghyab-postgres
    environment:
      POSTGRES_USER: hozorghyab
      POSTGRES_PASSWORD: hozorghyab
      POSTGRES_DB: hozorghyab
    ports:
      - "5440:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
